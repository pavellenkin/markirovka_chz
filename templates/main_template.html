    <style>
    .select-wrapper {
        display: inline-block;
        margin-right: 10px;
        vertical-align: top;
    }

    .form-select {
        display: inline-block;
        width: auto;
        min-width: 120px;
        padding: 0.375rem 2.25rem 0.375rem 0.75rem;
        font-size: 0.875rem;
        font-weight: 400;
        line-height: 1.5;
        color: #495057;
        background-color: #fff;
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23343a40' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M2 5l6 6 6-6'/%3e%3c/svg%3e");
        background-repeat: no-repeat;
        background-position: right 0.75rem center;
        background-size: 16px 12px;
        border: 1px solid #ced4da;
        border-radius: 0.25rem;
        transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
    }

    .form-select:focus {
        border-color: #80bdff;
        outline: 0;
        box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
    }

    .form-select-sm {
        padding: 0.25rem 1.75rem 0.25rem 0.5rem;
        font-size: 0.8125rem;
        min-width: 100px;
    }

    .form-select-lg {
        padding: 0.5rem 2.75rem 0.5rem 1rem;
        font-size: 1rem;
        min-width: 140px;
    }

    .table-data__tool-left .select-wrapper {
        margin-right: 15px;
    }

    .table-data__tool-right .select-wrapper {
        margin-left: 10px;
    }
</style>
    <style>
    .au-progress__inner {
        background: linear-gradient(90deg, #007bff 0%, #0056b3 100%);
        transition: width 0.3s ease-in-out;
    }

    .au-progress:nth-child(1) .au-progress__inner {
        background: linear-gradient(90deg, #007bff 0%, #0056b3 100%);
    }

    .au-progress:nth-child(2) .au-progress__inner {
        background: linear-gradient(90deg, #28a745 0%, #1e7e34 100%);
    }

    .au-progress:nth-child(3) .au-progress__inner {
        background: linear-gradient(90deg, #17a2b8 0%, #138496 100%);
    }

    .au-progress:nth-child(4) .au-progress__inner {
        background: linear-gradient(90deg, #ffc107 0%, #e0a800 100%);
    }
</style>
    <style>
    .modern-lightbox {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 9999;
    }

    .lightbox-backdrop {
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
    }

    .lightbox-content {
        position: relative;
        max-width: 90%;
        max-height: 90%;
        cursor: default;
    }

    .lightbox-content img {
        max-width: 100%;
        max-height: 100%;
        display: block;
    }

    .lightbox-close {
        position: absolute;
        top: -40px;
        right: 0;
        background: none;
        border: none;
        color: white;
        font-size: 30px;
        cursor: pointer;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .lightbox-open {
        overflow: hidden;
    }
</style>

<script>
function getCookie(name) {
    var matches = document.cookie.match(new RegExp("(?:^|; )" + name.replace(/([\.$?*|{}\(\)\[\]\\\/\+^])/g, '\\$1') + "=([^;]*)"));
    return matches ? decodeURIComponent(matches[1]) : undefined;}

function PostButtonCode(qwery){
    document.getElementById("message-bar").style.display = "none";
    document.getElementById("item_search").style.display = "none";
    $('#preloader').toggle();
    document.querySelector('#predmet').style.display = "block";
    document.querySelector('#predmet_text').style.display = "block";
    document.querySelector('#search_item').style.display = 'none';
    document.querySelector('#message-bar').style.display = 'none';
    code = qwery;
    type = localStorage.setupType;
    $.ajax({
                url: '/ps_in_code/',
                method: 'post',
                dataType: 'json',
                headers: {
    "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value
  },
                data: {
                type: type,
                code: code
                },
                success: async function(data){
                    if (data.status === 'href_none'){
                    $('#preloader').toggle();
                        document.querySelector('#search_item').style.display = 'block';
                        document.querySelector('#avatar').src = data.data.img;
                        document.querySelector('#shk_item').innerHTML = data.data.code;
                        document.querySelector('#text').innerHTML = "<b>" +data.data.text+"</b>" ;
                        document.querySelector('#identification').innerHTML = "&ensp;&ensp;" +data.data.identification;
                        document.querySelector('#org').innerHTML = data.data.org;
                        document.querySelector('#org_title').innerHTML = data.data.org_title;
                        document.querySelector('#inn_priority_title').innerHTML = data.data.inn_priority_title;
                        document.querySelector('#inn_priority').innerHTML = data.data.inn_priority;
                        document.querySelector('#inn_second_important').innerHTML = data.data.inn_second_important;
                        document.querySelector('#searchInput').value="";
                        document.querySelector('#predmet').style.display = "none";
                        document.querySelector('#predmet_text').style.display = "none";

                    }
                    else if (data.status === 'success'){
                        $('#preloader').toggle();
                        document.querySelector('#search_item').style.display = 'block';
                        document.querySelector('#avatar').src = data.data.img;
                        document.querySelector('#shk_item').innerHTML = data.data.code;
                        document.querySelector('#text').innerHTML = "<b>" +data.data.text+"</b>" ;
                        document.querySelector('#identification').innerHTML = "&ensp;&ensp;" +data.data.identification;
                        document.querySelector('#org').innerHTML = data.data.org;
                        document.querySelector('#org_title').innerHTML = data.data.org_title;
                        document.querySelector('#inn_priority_title').innerHTML = data.data.inn_priority_title;
                        document.querySelector('#inn_priority').innerHTML = data.data.inn_priority;
                        document.querySelector('#inn_second_important').innerHTML = data.data.inn_second_important;
                        document.querySelector('#searchInput').value="";
                    }
                    else {
                        $('#preloader').toggle();
                        document.querySelector('#message-bar').style.display = 'block';
                        document.querySelector('#message-bar-text').innerHTML = data.status;
                        document.querySelector('#searchInput').value="";
                        }
                }
            });
}

function hideKeyboard(element) {
    element.setAttribute('readonly', 'readonly'); // Force keyboard to hide on input field.
    element.setAttribute('disabled', 'true'); // Force keyboard to hide on textarea field.

        element.blur();  //actually close the keyboard

        element.removeAttribute('readonly');
        element.removeAttribute('disabled');
    }, 100);
}

// сохранение кода
function saveCodeToLocalStorage(code) {
    if (!code) return;

    // Получаем существующие коды
    let codes = localStorage.getItem('my_codes');
    if (codes) {
        codes = JSON.parse(codes);
    } else {
        codes = [];
    }

    // Проверяем, есть ли уже такой код
    if (codes.includes(code)) {
        console.log('Код уже существует, не добавлен:', code);
        return;
    }

    // Добавляем новый код
    codes.push(code);

    // Сохраняем обратно
    localStorage.setItem('my_codes', JSON.stringify(codes));

    console.log('Код сохранен:', code);
    console.log('Всего кодов:', codes.length);
}

function SaveInventCodes(art, key_value) {
    document.getElementById("search_art").style.display = "none";
    $('#preloader').show();

    // Обработка для key_value = 'content'
    let sendData = {
        key_value: key_value,
        art: art
    };

    // Если key_value = 'content', берем список кодов из localStorage
    if (key_value === 'content') {

        let codes = localStorage.getItem('my_codes');
        if (codes) {

            sendData.codes_list = codes;
        } else {
            sendData.codes_list = [];
        }
    }

    $.ajax({
        url: '/invent/',
        method: 'post',
        dataType: 'json',
        headers: {
            "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value
        },
        data: sendData,
        success: async function(data){
            $('#fillCodesModal').modal('hide');
            $('#preloader').fadeOut(500);
            if (data.status === 'success'){
                document.getElementById("response_check").style.display = "none";
                document.getElementById("overwrite").style.display = "none";
                document.getElementById('apply-bar-text').innerHTML = data.message;
                document.getElementById("apply_change").style.display = "block";
                // Очищаем коды после успешной отправки
                localStorage.removeItem('my_codes');
            }
            if (data.status === 'error'){
                document.getElementById("response_check").style.display = "none";
                document.getElementById('apply-bar-text').innerHTML = data.message;
                document.getElementById("apply_change").style.display = "block";
            }
            if (data.status === 'addon'){
                document.getElementById("response_check").style.display = "none";
                document.getElementById('apply-bar-text').innerHTML = data.message;
                const element = document.getElementById("overwrite");
                document.getElementById("overwrite").style.display = "block";
                const artValue = data.art;
                const keyValue = data.key_value;
                element.onclick = function() {
                    SaveInventCodes(artValue, keyValue);
                };
                document.getElementById("apply_change").style.display = "block";
            }
        }
    });
}

function uploadFileWithProgress() {
    const fileInput = document.getElementById('fileInput');
    const file = fileInput.files[0];

    const formData = new FormData();
    formData.append('file', file);

    const xhr = new XMLHttpRequest();
    token = document.querySelector('[name=csrfmiddlewaretoken]').value;


    // Отслеживание прогресса
    xhr.upload.addEventListener('progress', (event) => {
        if (event.lengthComputable) {
            const percentComplete = (event.loaded / event.total) * 100;
            console.log(`Загружено: ${percentComplete.toFixed(2)}%`);
        }
    });

    xhr.addEventListener('load', (event) => {
        console.log('Загрузка завершена');
        const response = JSON.parse(xhr.responseText);
        console.log('Ответ:', response);
    });

    xhr.addEventListener('error', () => {
        console.error('Ошибка загрузки');
    });

    xhr.open('POST', '/certs/');
    xhr.setRequestHeader('X-CSRFToken', token);
    xhr.send(formData);
}
</script>

  const loadingSpinner = document.getElementById('loadingSpinner');

  // Открыть диалог выбора файла при клике на кнопку "Обзор"
  btnBrowse.addEventListener('click', function() {
    fileInput.click();
  });

  // Показать имя выбранного файла
  fileInput.addEventListener('change', function() {
    if (this.files.length > 0) {
      console.log('Выбран файл:', this.files[0].name);
    }
  });

  // Обработка отправки формы (AJAX пример)
  uploadForm.addEventListener('submit', function(e) {
    e.preventDefault();

    // Показать спиннер загрузки
    loadingSpinner.classList.remove('d-none');

    // Создаем FormData объект
    const formData = new FormData(this);

    // Отправляем AJAX запрос
    fetch(this.action, {
      method: 'POST',
      body: formData,
      headers: {
        // Заголовки не нужны для FormData, браузер установит сам
      }
    })
    .then(response => {
      if (!response.ok) {
        throw new Error('Ошибка сети');
      }
      else {

      }
      return response.json();
    })
    .then(data => {
      alert('Файл успешно загружен!');

    .catch(error => {

    .finally(() => {

});
